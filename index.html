<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Encore">
<meta name="theme-color" content="#0e0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style id="kd-style">
:root{
  /* Late-night studio: lamp-lit amber on warm black, After Hours red for guitar. One column, sticky header, fixed tab bar. */
  --bg:#0e0c0a;--surface:#181512;--raise:#221e19;--line:#322b24;--text:#f2e9db;--muted:#a69a8a;--faint:#6e655a;
  --lamp:#eba95b;--lamp-ink:#1c1206;--piano:#eadcc3;--guitar:#e3584a;--good:#8cc583;--warn:#e8bb52;
  --display:'Cormorant Garamond',Cormorant,Georgia,'Times New Roman',serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:0 16px 150px}
a{color:var(--lamp)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px;color:var(--faint)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px;background:linear-gradient(var(--bg) 70%,rgba(14,12,10,0))}
.top-left{display:flex;gap:11px;align-items:center;min-width:0}
.avatar{position:relative;width:46px;height:46px;border-radius:50%;padding:2px;background:conic-gradient(from 200deg,var(--lamp),var(--guitar),var(--lamp));flex:none;overflow:hidden;display:block}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg);display:block}
.avatar input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.2em;line-height:1}
.brand b{color:var(--lamp);font-weight:700}
.handles{font-size:12px;color:var(--muted);margin-top:4px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.top-row{display:flex;align-items:center;gap:8px}
.theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--raise);font-size:15px;line-height:1;padding:0;display:grid;place-items:center}
.clock{font-family:var(--display);font-size:36px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.cloud{color:var(--good);border-color:rgba(140,197,131,.35)}.sync.saving{color:var(--warn);border-color:rgba(232,187,82,.35)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,15,12,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.nav-in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--faint);font-size:10.5px;font-weight:600;border-radius:10px}
.nav a svg{width:22px;height:22px}.nav a[aria-current="page"]{color:var(--lamp)}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .link{letter-spacing:0;text-transform:none;font-size:13px}
.page-title{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 2px}
.page-sub{color:var(--muted);margin:0 0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.tile .s{font-size:12px;color:var(--faint);margin-top:4px}
.meter{height:6px;background:var(--raise);border-radius:99px;overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;background:var(--lamp);border-radius:99px}.meter.guitar span{background:var(--guitar)}
.level{background:radial-gradient(120% 140% at 0% 0%,rgba(235,169,91,.16),transparent 60%),var(--surface)}
.lv-top{display:flex;gap:14px;align-items:center}
.lv-badge{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--lamp);color:var(--lamp);font-family:var(--display);font-weight:700;font-size:22px;box-shadow:0 0 24px rgba(235,169,91,.25)}
.lv-title{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.04em}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2a2018,#141110 70%);border-color:#3e3227;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(235,169,91,.3),transparent 65%);pointer-events:none}
.hero img{width:86px;height:116px;object-fit:cover;border-radius:10px;position:relative;z-index:1;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--lamp);font-weight:600}
.hero .t{font-family:var(--display);font-size:26px;line-height:1.05;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:8px}
.hero .a{font-family:var(--display);font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:10px;line-height:1}
.hero .big small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-label em{font-style:normal;font-size:10px;color:var(--faint);margin-left:5px;font-weight:600}
.bar-track{height:10px;background:var(--raise);border-radius:99px;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:99px;background:var(--piano)}.bar-fill.guitar{background:var(--guitar)}
.bar-val{font-variant-numeric:tabular-nums;font-weight:600;min-width:42px;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--raise);color:var(--muted)}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--piano)}.tag.guitar .dot{background:var(--guitar)}
.tag.pin{color:var(--lamp)}.tag.sugg{color:var(--warn)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px}
.vrow img,.vrow .fph{width:46px;height:62px;border-radius:8px;object-fit:cover;background:var(--raise)}
.vt{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.va{font-size:13px;color:var(--muted);margin:3px 0 7px}
.vv{text-align:right}.vv b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.vv span{font-size:11px;color:var(--faint)}
.empty{text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:22px;color:var(--text);letter-spacing:.05em;margin-bottom:4px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.stages.two{grid-template-columns:1fr 1fr}
.stages button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.stages button[aria-pressed="true"]{background:var(--raise);color:var(--text)}
.stages button span{display:block;font-size:17px;font-variant-numeric:tabular-nums;color:var(--lamp)}
.song{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.song-main{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 14px 8px}
.song-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.diff{letter-spacing:2px;color:var(--lamp);font-size:11px}.diff i{color:var(--line);font-style:normal}
.song-note{font-size:13px;color:var(--muted);margin-top:7px}
.song-bar{padding:0 14px 4px}
.song-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 10px 14px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.btn.ghost{background:none}.btn.danger{color:var(--guitar);border-color:rgba(227,88,74,.4)}
.btn.armed{background:var(--guitar);color:#fff;border-color:var(--guitar)}
.btn:disabled{opacity:.5}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn-row .grow{flex:1}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.fab{position:fixed;right:max(16px,calc(50% - 274px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;border:0;background:var(--lamp);color:var(--lamp-ink);font-weight:700;border-radius:99px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 22px rgba(235,169,91,.3)}
.insight{border-left:3px solid var(--lamp);background:var(--raise);border-radius:4px 12px 12px 4px;padding:12px 14px}
.insight.good{border-color:var(--good)}.insight.warn{border-color:var(--warn)}
.insight b{display:block;margin-bottom:3px}.insight p{margin:0;font-size:14px;color:var(--muted)}
.insight a{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;text-decoration:none}
.timer{text-align:center}
.timer-display{font-family:var(--display);font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0 14px}
.timer-display.live{color:var(--lamp);text-shadow:0 0 30px rgba(235,169,91,.35)}
.timer .btn-row{justify-content:center;margin-top:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.wcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wstack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;background:var(--raise);min-height:4px}
.wcol .wv{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:15px}
.wcol .wd{font-size:11px;color:var(--faint);font-weight:600}.wcol.today .wd{color:var(--lamp)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3 div{background:var(--raise);border-radius:12px;padding:10px;text-align:center}
.stats3 b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stats3 span{font-size:11px;color:var(--muted)}
.session{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.session:first-child{border-top:0}
.xbtn{background:none;border:0;color:var(--faint);font-size:20px;line-height:1;padding:4px 8px}
.bpm{display:flex;align-items:center;justify-content:center;gap:16px}
.bpm output{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;min-width:120px;text-align:center;line-height:1}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--raise);font-size:22px}
.tempo-name{text-align:center;font-family:var(--display);font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px}
input[type=range]{width:100%;accent-color:var(--lamp)}
.dots{display:flex;justify-content:center;gap:10px;margin:14px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--raise);border:1px solid var(--line)}
.dots i.on{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 14px rgba(235,169,91,.6)}
.dots i.on.acc{background:var(--guitar);border-color:var(--guitar)}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.strings button{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 0 9px;display:flex;flex-direction:column;align-items:center}
.strings b{font-family:var(--display);font-size:24px;line-height:1}.strings span{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:3px}
.strings button.ring{border-color:var(--guitar);box-shadow:0 0 16px rgba(227,88,74,.45)}
.tune-result{margin-top:12px;background:var(--raise);border-radius:12px;padding:14px;text-align:center}
.tune-result b{display:block;font-family:var(--display);font-size:40px;line-height:1}
.needle{position:relative;height:8px;background:linear-gradient(90deg,var(--guitar),var(--warn) 35%,var(--good) 45%,var(--good) 55%,var(--warn) 65%,var(--guitar));border-radius:99px;margin:12px 0 6px}
.needle i{position:absolute;top:-6px;width:4px;height:20px;background:var(--text);border-radius:2px;margin-left:-2px}
.root-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.root-grid button,.qual-grid button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:9px 0;font-weight:700;font-size:14px}
.qual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.root-grid button[aria-pressed="true"],.qual-grid button[aria-pressed="true"]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.chord-name{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:.04em;text-align:center;line-height:1;margin:16px 0 4px}
.chord-notes{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px;letter-spacing:.08em}
.kbd{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.kbd rect{cursor:pointer}
.fret-wrap{display:flex;justify-content:center;margin-top:14px}
.big-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #4a3a2c;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,rgba(235,169,91,.16),rgba(227,88,74,.08)),var(--surface)}
.big-btn .ic{width:52px;height:52px;border-radius:14px;background:var(--lamp);color:var(--lamp-ink);display:grid;place-items:center;flex:none}
.big-btn .ic svg{width:28px;height:28px}
.big-btn b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.big-btn span{font-size:13px;color:var(--muted)}
.fb-wrap{overflow-x:auto;margin:0 -16px;padding:4px 16px 0}
.fb{display:grid;grid-template-columns:30px repeat(15,50px);min-width:max-content;background:linear-gradient(#2c1f15,#1d150e);border-radius:8px;padding:6px 0}
.fb .lab{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);height:34px}
.fb .cell{position:relative;height:34px;border:0;border-right:2px solid #8c7a63;background:none;padding:0}
.fb .cell.nut{border-right:5px solid #e9dcc3}
.fb .cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--sw,1px);background:#cfc1aa;transform:translateY(-50%)}
.fb .dot{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;display:none;place-items:center;font-size:9.5px;font-weight:700;z-index:1}
.fb .cell.on .dot{display:grid;background:var(--lamp);color:var(--lamp-ink)}
.fb .cell.root .dot{display:grid;background:var(--guitar);color:#fff}
.fb .cell.hit .dot{display:grid;background:#fff;color:#000}
.fb .num{text-align:center;font-size:10px;color:var(--faint);padding-top:4px}
.fb .num.mk{color:var(--lamp);font-weight:700}
.sheet-sec{margin-top:14px}
.sheet-sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:9px 12px;font-family:var(--display);font-weight:700;font-size:20px;min-width:54px;line-height:1}
.cchip.on{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.cchip.beat{box-shadow:0 0 0 2px var(--guitar)}
.chip-view{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.song-link-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.song-link-row:first-child{border-top:0}
.song-link-row .t{font-weight:600;font-size:14px}.song-link-row .a{font-size:12px;color:var(--muted)}
.goal{padding:10px 0;border-top:1px solid var(--line);display:block;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.goal:first-child{border-top:0}
.goal-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.goal-top b{font-weight:600}.goal-top span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal.done .goal-top b::after{content:" ✓";color:var(--good)}
.check{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--lamp);margin:1px 0 0;flex:none}
.check input:checked+span{color:var(--faint);text-decoration:line-through}
.idea{background:var(--raise);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.idea .vt{font-size:18px}.idea p{margin:0;font-size:13px;color:var(--muted)}
.ai-box{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--lamp);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -16px}
.vtile{position:relative;aspect-ratio:3/4;border:0;padding:0;background:#1d1915;overflow:hidden;display:block;width:100%}
.vtile img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;line-height:1.15;color:#e2d1b6;background:radial-gradient(circle at 50% 28%,rgba(235,169,91,.3),transparent 60%),linear-gradient(#2b221b,#120f0d)}
.ph small{font-size:11px;color:var(--muted);margin-top:4px}
.vtile .ov{position:absolute;left:0;right:0;bottom:0;padding:26px 8px 7px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.88));font-size:13px;font-weight:700;display:flex;gap:4px;align-items:center;color:#fff}
.vtile .ov svg{width:12px;height:12px}
.vtile .pf{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}
.vtile.guitar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--guitar)}
.plat-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 2px}
.plat-head b{font-family:var(--display);font-size:22px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.plat-head span{font-size:12px;color:var(--muted)}
.plat-head a{font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.view-toggle{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.view-toggle button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.view-toggle button[aria-pressed="true"]{background:var(--raise);color:var(--text)}
.import{background:linear-gradient(135deg,rgba(235,169,91,.14),rgba(227,88,74,.08)),var(--surface);border-color:#4a3a2c}
.import p{margin:0 0 12px;color:var(--muted);font-size:14px}
.thumb-edit{display:flex;gap:12px;align-items:center}
.thumb-edit img,.thumb-edit .fph{width:72px;height:96px;object-fit:cover;border-radius:10px;background:var(--raise);flex:none;position:relative}
.wk-pick{display:flex;gap:12px;align-items:center}
.wk-pick .ic{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#e3584a,#4a120d);flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#ffe2bd;font-size:20px}
#sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
#sheet-wrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:580px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;padding-right:40px;line-height:1.05}
.sheet-x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--raise);font-size:22px;line-height:1}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.field input:not([type=radio]):not([type=checkbox]):not([type=range]):not([type=file]),.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg-opt{flex:1;position:relative}
.seg-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-opt span{display:block;text-align:center;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg-opt input:checked+span{background:var(--raise);color:var(--text)}
.inline-check{display:flex;gap:10px;align-items:center;font-size:14px}
.inline-check input{width:20px;height:20px;accent-color:var(--lamp)}
.spark{width:100%;height:auto;display:block}
.ext-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ext-links a{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:600;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:120;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:110;pointer-events:none}
.credit{text-align:center;font-size:12px;color:var(--faint);padding:18px 0 4px;letter-spacing:.06em}
.credit a{color:var(--muted);text-decoration:none;font-weight:600}.credit a b{color:var(--lamp)}
/* intro player */
.np{display:flex;gap:12px;align-items:center;margin-top:20px;padding:10px 14px 10px 10px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid rgba(235,169,91,.25);text-align:left;max-width:340px;width:100%}
.np-art{width:44px;height:44px;border-radius:9px;flex:none;background:linear-gradient(135deg,#e3584a,#5a1610);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:10px 0}
.np-art i{width:4px;background:#ffe2bd;border-radius:2px;height:30%;animation:eq 1s ease-in-out infinite}
.np-art i:nth-child(2){animation-delay:-.3s}.np-art i:nth-child(3){animation-delay:-.6s}.np-art i:nth-child(4){animation-delay:-.15s}
.np-art.paused i{animation:none;height:25%}
@keyframes eq{0%,100%{height:25%}50%{height:90%}}
.np-k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c99f84}
.np-t{font-weight:700;font-size:15px;color:#ffe8cc}
.np-l{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:12px}
.np-l a,.np-l label{color:var(--lamp);font-weight:600;text-decoration:none;cursor:pointer;position:relative;overflow:hidden}
.np-l input{position:absolute;inset:0;opacity:0;font-size:0}
#player{position:fixed;left:max(16px,calc(50% - 274px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:16;display:none;align-items:center;gap:8px;border:1px solid #4a3a2c;background:rgba(24,21,18,.95);border-radius:99px;padding:6px 8px 6px 6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#player.show{display:flex}
#player .np-art{width:30px;height:30px;border-radius:50%;padding:7px 0;gap:2px}
#player .np-art i{width:3px}
#player .pt{font-size:12px;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player button{border:0;background:var(--raise);color:var(--text);width:30px;height:30px;border-radius:50%;font-size:12px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px calc(48px + env(safe-area-inset-bottom));background:radial-gradient(90% 60% at 50% 38%,#3a1712 0%,#1b0d0a 45%,#0a0807 100%);transition:opacity .7s ease,transform .7s ease;overflow:auto}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.vembed{position:relative;width:100%;max-width:340px;margin:0 auto 14px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000}.vembed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sp-wk{position:relative;max-width:340px;margin:6px auto 16px;padding:10px 14px;border:1px solid rgba(255,179,138,.25);border-radius:12px;background:rgba(255,140,90,.06)}.sp-wk span{display:block;margin-bottom:4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ffb38a}.sp-wk b{display:block;font-size:14px;line-height:1.4;font-weight:500;color:#fff}.sp-wk i{display:block;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,179,138,.18);font-size:13px;line-height:1.4;color:rgba(255,230,215,.85)}.sp-wk em{display:block;margin-top:3px;font-style:normal;font-size:10px;letter-spacing:.2em;color:#e8a54b}.sp-wk em:before{content:'— '}
.sp-special{position:relative;max-width:340px;margin:2px auto 12px;padding:12px 16px;border-radius:14px;font-size:15px;line-height:1.45;font-weight:500;color:#fff;background:linear-gradient(135deg,rgba(232,165,75,.22),rgba(255,120,90,.14));border:1px solid rgba(232,165,75,.45);box-shadow:0 0 28px rgba(232,165,75,.18)}.sp-special em{display:block;margin-top:4px;font-style:normal;font-size:10px;letter-spacing:.2em;color:#e8a54b}.sp-special em:before{content:'— '}
.soon{opacity:.85}.soon-tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle;color:var(--lamp-ink);background:var(--lamp)}
.quote-card .q{margin:0;font-size:17px;line-height:1.45;font-weight:500;color:var(--text)}.quote-card .qy{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45;font-style:italic;color:var(--muted)}.quote-card .by{margin:4px 0 0;font-size:10.5px;letter-spacing:.2em;color:var(--lamp)}.quote-card .by:before{content:'— '}
.quote-card.special{border-color:var(--lamp);background:linear-gradient(135deg,color-mix(in srgb,var(--lamp) 18%,var(--surface)),var(--surface))}
.sp-logo{position:relative;width:96px;height:96px;margin:0 auto 10px;border-radius:22px;box-shadow:0 0 40px rgba(235,169,91,.25)}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.theme-sw{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:inherit;font-size:14px;text-align:left}.theme-sw i{width:22px;height:22px;border-radius:50%;flex:none}.theme-sw.on{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp)}
.theme-red{--lamp:#e3584a}.theme-red #splash{background:radial-gradient(90% 60% at 50% 38%,#4a1210 0%,#1d0908 45%,#0a0606 100%)}
.theme-blue{--lamp:#5ea8ff;--lamp-ink:#06101c}.theme-blue #splash{background:radial-gradient(90% 60% at 50% 38%,#11264a 0%,#0a1428 45%,#05070c 100%)}
.theme-pink{--lamp:#ff8fc4}.theme-pink #splash{background:radial-gradient(90% 60% at 50% 38%,#4a1838 0%,#22101e 45%,#0b0709 100%)}
.theme-green{--lamp:#4fc98a;--lamp-ink:#051c10}.theme-green #splash{background:radial-gradient(90% 60% at 50% 38%,#0f3a26 0%,#0a1d14 45%,#050a07 100%)}
.theme-purple{--lamp:#b48cff}.theme-purple #splash{background:radial-gradient(90% 60% at 50% 38%,#2c1a52 0%,#160d2a 45%,#07050c 100%)}
/* special-day themes (class set on <html> by specialDay()) */
.day-xmas{--lamp:#e5484d;--good:#4fb07a;--warn:#7fd39b;--line:#3a2a26}
.day-xmas #splash{background:radial-gradient(90% 60% at 50% 38%,#5a1414 0%,#16301f 52%,#070a08 100%)}
.day-bday{--lamp:#ff8fc4;--warn:#f2c14e;--line:#3a2733}
.day-bday #splash{background:radial-gradient(90% 60% at 50% 38%,#5b1f47 0%,#2a1236 50%,#0b0710 100%)}
.day-ny{--lamp:#f0c75e;--warn:#b9a2ff;--line:#2b2a3d}
.day-ny #splash{background:radial-gradient(90% 60% at 50% 38%,#2b2466 0%,#120f2e 50%,#05050c 100%)}
.day-bday .sp-special{background:linear-gradient(135deg,rgba(255,143,196,.28),rgba(242,193,78,.2));border-color:rgba(255,143,196,.5)}
.sp-special.xmas{background:linear-gradient(135deg,rgba(200,40,40,.3),rgba(30,120,60,.25));border-color:rgba(255,120,120,.45)}.sp-special.ny{background:linear-gradient(135deg,rgba(232,165,75,.28),rgba(120,90,255,.18))}
#splash canvas{position:fixed;inset:0;width:100%;height:100%}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:420px;width:100%}
.sp-avatar{width:84px;height:84px;margin-bottom:14px;box-shadow:0 0 40px rgba(227,88,74,.35)}
.sp-time{font-family:var(--display);font-weight:600;font-size:min(28vw,120px);line-height:.9;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:#ffe8cc;text-shadow:0 0 40px rgba(227,88,74,.55),0 0 90px rgba(235,169,91,.25)}
.sp-sec{font-size:.28em;color:var(--guitar);vertical-align:.55em;margin-left:4px}
.sp-date{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#d8b9a0}
.sp-greet{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:18px}
.sp-line{font-family:var(--display);font-style:italic;font-size:20px;color:#e9cdb4;min-height:56px;margin:4px 0 0;transition:opacity .6s}
.sp-enter{margin-top:20px;border:1px solid rgba(235,169,91,.6);background:rgba(235,169,91,.14);color:#ffe2bd;border-radius:99px;padding:15px 28px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;box-shadow:0 0 30px rgba(227,88,74,.25)}
.sp-credit{margin-top:22px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#8d7563}
.sp-credit b{color:var(--lamp)}
/* full piano */
#fp{position:fixed;inset:0;z-index:95;background:#0b0907;display:none;overflow:hidden}
#fp.open{display:block}
#fp-in{position:absolute;top:0;left:0;display:flex;flex-direction:column;transform-origin:top left}
.fp-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;overflow-x:auto;flex:none;border-bottom:1px solid var(--line);background:#141110}
.fp-bar .ttl{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:18px;white-space:nowrap;margin-right:6px}
.fp-bar .btn{flex:none;padding:7px 10px;font-size:12px}
.fp-bar label.tg{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.fp-bar label.tg input{accent-color:var(--lamp);width:16px;height:16px}
.fp-bar input[type=range]{width:90px;flex:none}
.fp-nav{flex:none;padding:6px 12px;background:#141110}
.fp-keys{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fp-row{position:absolute;top:0;bottom:0;left:0;will-change:transform}
.wk{position:absolute;top:0;bottom:0;background:linear-gradient(#fbf6ee 70%,#e6dccb);border:1px solid #8f8574;border-top:0;border-radius:0 0 8px 8px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.wk span{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:#8a7f70;pointer-events:none}
.bk{position:absolute;top:0;height:62%;background:linear-gradient(#34302c,#0d0b0a 85%);border-radius:0 0 6px 6px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.5)}
.wk.hl{background:linear-gradient(#fbf6ee 40%,#f3c98f)}.bk.hl{background:linear-gradient(#34302c,#a8672a)}
.wk.down{background:linear-gradient(#f6d6a8,#eba95b)}.bk.down{background:linear-gradient(#e3584a,#8c2a20)}
.fp-hint{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;pointer-events:none}
/* opening screen: fit the phone, never show a scrollbar */
#splash{overflow-x:hidden;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;justify-content:safe center;padding-top:calc(20px + env(safe-area-inset-top));overscroll-behavior:contain}
#splash::-webkit-scrollbar{display:none;width:0;height:0}
@media (max-height:820px){.sp-avatar{width:68px;height:68px;margin-bottom:8px}.sp-time{font-size:min(24vw,100px)}.sp-greet{margin-top:10px;font-size:24px}.sp-line{min-height:46px;font-size:18px}.np{margin-top:12px}.sp-enter{margin-top:14px;padding:13px 24px}.sp-credit{margin-top:14px}}
@media (max-height:700px){.sp-avatar,.sp-logo{display:none}.sp-time{font-size:min(20vw,80px)}.sp-greet{margin-top:6px;font-size:21px}.sp-line{display:none}.np{margin-top:8px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.tile .v{font-size:25px}.timer-display{font-size:54px}}

button.avatar{border:0;cursor:pointer}
.color-pick{width:48px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:2px;cursor:pointer}
/* colour schemes */
html.mode-black{--bg:#000;--surface:#0b0b0b;--raise:#161616;--line:#272727}
html.mode-black .top{background:linear-gradient(#000 70%,rgba(0,0,0,0))}
html.mode-black .nav{background:rgba(0,0,0,.94)}
html.mode-light{--bg:#f5efe6;--surface:#fffaf3;--raise:#efe5d6;--line:#e1d4c1;--text:#1e1813;--muted:#6a5e50;--faint:#988c7c;--piano:#b48a52;color-scheme:light}
html.mode-light body{background:var(--bg);color:var(--text)}
html.mode-light .top{background:linear-gradient(var(--bg) 70%,rgba(245,239,230,0))}
html.mode-light .nav{background:rgba(255,250,243,.95)}
html.mode-light .hero{background:linear-gradient(160deg,#fff0db,#f3e5d1 70%);border-color:#e5d1b3}
html.mode-light #player{background:rgba(255,250,243,.96);border-color:var(--line)}
html.mode-light #bg{opacity:.3}
html.mode-light .scrim{background:rgba(40,25,10,.35)}
html.mode-light .lv-badge{box-shadow:none}

/* firm, app-like feel: no sideways drift, no rubber-band bounce */
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%;overscroll-behavior:none}
body{touch-action:pan-y pinch-zoom;-webkit-tap-highlight-color:transparent}
#app{overflow-x:clip}
button,a,label,.vtile,.cell,.cchip{touch-action:manipulation}
.fb-wrap,.kbd-wrap,.fp-bar,.chips,.sheet{touch-action:pan-x pan-y;overscroll-behavior:contain}
.fp-keys{touch-action:none}

/* onboarding */
#onboard{position:fixed;inset:0;z-index:105;overflow-y:auto;scrollbar-width:none;background:radial-gradient(90% 60% at 50% 25%,color-mix(in srgb,var(--lamp) 22%,#120d0a) 0%,var(--bg) 60%);display:flex;justify-content:center;transition:opacity .45s}
#onboard::-webkit-scrollbar{display:none}
#onboard.out{opacity:0;pointer-events:none}
.ob-in{width:100%;max-width:440px;padding:calc(36px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100%;justify-content:center}
.ob-in h2{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.05}
.ob-in .muted{margin:-6px 0 4px}
.ob-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.ob-logo{width:96px;height:96px;border-radius:24px;box-shadow:0 0 50px color-mix(in srgb,var(--lamp) 45%,transparent)}
.ob-hero h1{font-family:var(--display);font-size:52px;letter-spacing:.22em;font-weight:700;margin-top:6px}
.ob-hero h1 b{color:var(--lamp)}
.ob-hero p{color:var(--muted);font-size:16px;max-width:320px;margin:0}
.ob-feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ob-feat span{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600}
.ob-cta{padding:16px;font-size:16px;border-radius:99px}
.ob-sub{border:0}
.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.ob-dots i{width:26px;height:4px;border-radius:99px;background:var(--line)}
.ob-dots i.on{background:var(--lamp)}.ob-dots i.done{background:color-mix(in srgb,var(--lamp) 55%,var(--line))}
.ob-photo{display:flex;align-items:center;gap:14px}
.ob-photo img,.ob-photo span{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--raise);border:2px solid var(--lamp);display:grid;place-items:center;font-size:30px;color:var(--muted)}

function voice(m,kind,vol,when){var c=ctx();if(!c) return null;var t=when||c.currentTime,f=midiF(m),g=c.createGain(),lp=c.createBiquadFilter(),dec=kind==='guitar'?3.2:Math.max(1.4,7-(m-21)/14);vol=vol||.3;
  lp.type='lowpass';lp.frequency.setValueAtTime(kind==='guitar'?2800:Math.min(9000,1600+f*5),t);lp.frequency.exponentialRampToValueAtTime(Math.max(380,f*1.4),t+dec*.6);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(vol*.4,t+.28);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  var o1=c.createOscillator(),o2=c.createOscillator();o1.setPeriodicWave(wave(kind));o2.setPeriodicWave(wave(kind));o1.frequency.value=f;o2.frequency.value=f*1.0018;
  o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(MASTER);o1.start(t);o2.start(t);o1.stop(t+dec+.1);o2.stop(t+dec+.1);
  var vh={o:o1,t:t+dec};LIVE_VOICES=LIVE_VOICES.filter(function(v){return v.t>c.currentTime});LIVE_VOICES.push(vh);if(LIVE_VOICES.length>40){var oldest=LIVE_VOICES.shift();if(oldest.stop) oldest.stop()}
  vh.stop=function(){try{var n=c.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n);g.gain.exponentialRampToValueAtTime(.0001,n+.3);o1.stop(n+.35);o2.stop(n+.35)}catch(e){}};return vh}
function playChord(root,q,kind,when,len){var c=ctx();if(!c) return;var t=when||c.currentTime;
  if(kind==='guitar'){var sh=guitarShape(root,q),k=0;sh.forEach(function(f,s){if(f<0) return;voice(OPEN_MIDI[s]+f,'guitar',.16,t+k*.03);k++});}
  else{voice(36+root,'piano',.16,t);qual(q)[3].forEach(function(i){voice(60+root+i-(root>6?12:0),'piano',.15,t)})}}

function apiSample(){function call(prompt,opts){var imgs=(opts&&opts.images)||[];return Promise.all(imgs.map(shrink)).then(function(ims){var ac=window.AbortController?new AbortController():null,to=ac&&setTimeout(function(){ac.abort()},45000);return fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:typeof prompt==='string'?prompt:JSON.stringify(prompt),images:ims}),signal:ac&&ac.signal}).finally(function(){clearTimeout(to)})}).then(function(r){if(r.status===429) throw {code:'rate_limited'};if(!r.ok) throw {code:'error'};return r.json()},function(e){throw {code:'error'}}).then(function(j){return j.text||''})}
  var f=function(p,o){return call(p,o).then(function(t){return {text:t}})};f.json=function(p,o){return call(p,o).then(function(t){var m=String(t).match(/[\[{][\s\S]*[\]}]/);if(!m) throw {code:'bad'};return JSON.parse(m[0])})};f.limits=function(){return {images:true}};return f}

})();
